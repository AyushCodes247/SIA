services:
  redis:
    image: redis:alpine
    container_name: sia_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: sia_rabbit
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sia_vector
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  redis-data:
  pg-data:
